<div class="dice-container">
  <canvas #diceCanvas></canvas>

  @if (resultText) {
    <div class="overlay">
      <h1>{{ resultText }}</h1>
      <div class="buttons">
        <button (click)="reset()">Újra</button>
        <button (click)="close()">Bezárás</button>
      </div>
    </div>
  }
</div>
