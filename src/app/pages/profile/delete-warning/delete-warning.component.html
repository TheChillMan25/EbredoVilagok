<div class="warning-container">
  <div class="warning-title">Törlés...</div>
  <div class="warning-desc">Biztosan törölni szeretnéd?</div>
  <div class="warning-actions">
    <button class="fake-button" (click)="delete()">Igen</button>
    <button class="fake-button" (click)="close($event)">Nem</button>
    <mat-checkbox (change)="checkboxChange($event.checked)">Megjegyzés</mat-checkbox>
  </div>
</div>
