<div class="item" (click)="selectItem()" [ngClass]="{ canUse: canUse }">
  <span class="item-name"
    >{{ item.name }}@if($any(item).effect){<mat-icon
      fontSet="material-symbols-outlined"
      [matTooltip]="$any(item).effect"
      >help</mat-icon
    >}@if($any(item).heal !== undefined){<span
      >( {{ $any(item).portion }} fejadag )</span
    ><mat-icon
      fontSet="material-symbols-outlined"
      [matTooltip]="'Gyógyítás: ' + $any(item).heal + ' HP'"
      >help</mat-icon
    >}</span
  >
  <span class="item-desc" matTooltip="{{ item.desc }}">{{ item.desc }}</span>
</div>
